name: Portfolio QA + capturas visuais

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1' # Mondays at 11:00 UTC: audit deployed portfolio
  workflow_dispatch:
    inputs:
      target:
        description: 'Origem das capturas'
        type: choice
        options: [local, published]
        default: local

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run functional tests
        run: npm run test:e2e
      - name: Capture screenshots and inspect layout
        if: always()
        env:
          SCREENSHOT_URL: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'published')) && 'https://helioconde.github.io/portfolio2.0/' || '' }}
        run: npm run screenshots
      - name: Build screenshot gallery and metrics report
        if: always()
        run: |
          npm run screenshots:report
          cat visual-reports/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots and visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-capturas-visuais
          path: visual-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-falhas-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
